<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Cadastre-se como voluntário da ONG Conexão Solidária.">

    <title>Conexão Solidária | Cadastro</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">

            <h1>Conexão Solidária</h1>

            <nav aria-label="Navegação principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="cadastro.html">Seja Voluntário</a></li>
                </ul>
            </nav>

        </div>
    </header>


    <main>

        <section class="titulo-pagina">
            <div class="container">

                <h2>Cadastro de Voluntário</h2>

                <p>
                    Preencha seus dados para demonstrar interesse
                    em participar dos nossos projetos sociais.
                </p>

            </div>
        </section>


        <section class="area-formulario">
            <div class="container">

                <form id="formCadastro">

                    <fieldset>

                        <legend>Dados pessoais</legend>

                        <div class="campo">

                            <label for="nome">
                                Nome completo:
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                minlength="3"
                                required
                                autocomplete="name">

                        </div>


                        <div class="campo">

                            <label for="cpf">
                                CPF:
                            </label>

                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                                title="Digite o CPF no formato 000.000.000-00"
                                required
                                inputmode="numeric">

                        </div>


                        <div class="campo">

                            <label for="nascimento">
                                Data de nascimento:
                            </label>

                            <input
                                type="date"
                                id="nascimento"
                                name="nascimento"
                                required>

                        </div>

                    </fieldset>


                    <fieldset>

                        <legend>Contato</legend>

                        <div class="campo">

                            <label for="email">
                                E-mail:
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="exemplo@email.com"
                                required
                                autocomplete="email">

                        </div>


                        <div class="campo">

                            <label for="telefone">
                                Telefone:
                            </label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(11) 99999-9999"
                                maxlength="15"
                                pattern="\(\d{2}\) \d{5}-\d{4}"
                                title="Digite o telefone no formato (00) 00000-0000"
                                required
                                autocomplete="tel"
                                inputmode="numeric">

                        </div>

                    </fieldset>


                    <fieldset>

                        <legend>Endereço</legend>

                        <div class="campo">

                            <label for="cep">
                                CEP:
                            </label>

                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="00000-000"
                                maxlength="9"
                                pattern="\d{5}-\d{3}"
                                title="Digite o CEP no formato 00000-000"
                                required
                                autocomplete="postal-code"
                                inputmode="numeric">

                        </div>


                        <div class="campo">

                            <label for="endereco">
                                Endereço:
                            </label>

                            <input
                                type="text"
                                id="endereco"
                                name="endereco"
                                required
                                autocomplete="street-address">

                        </div>


                        <div class="campo">

                            <label for="cidade">
                                Cidade:
                            </label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                required
                                autocomplete="address-level2">

                        </div>


                        <div class="campo">

                            <label for="estado">
                                Estado:
                            </label>

                            <select
                                id="estado"
                                name="estado"
                                required
                                autocomplete="address-level1">

                                <option value="">
                                    Selecione
                                </option>

                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>

                            </select>

                        </div>

                    </fieldset>


                    <fieldset>

                        <legend>Voluntariado</legend>

                        <div class="campo">

                            <label for="area">
                                Área de interesse:
                            </label>

                            <select
                                id="area"
                                name="area"
                                required>

                                <option value="">
                                    Selecione uma área
                                </option>

                                <option value="alimentos">
                                    Distribuição de alimentos
                                </option>

                                <option value="educacao">
                                    Educação
                                </option>

                                <option value="doacoes">
                                    Organização de doações
                                </option>

                                <option value="tecnologia">
                                    Tecnologia
                                </option>

                                <option value="eventos">
                                    Eventos
                                </option>

                            </select>

                        </div>


                        <div class="campo">

                            <label for="mensagem">
                                Conte um pouco sobre você:
                            </label>

                            <textarea
                                id="mensagem"
                                name="mensagem"
                                rows="5"
                                maxlength="500"
                                placeholder="Por que você gostaria de participar da nossa ONG?"></textarea>

                        </div>


                        <div class="termos">

                            <input
                                type="checkbox"
                                id="termos"
                                name="termos"
                                required>

                            <label for="termos">
                                Declaro que as informações fornecidas
                                são verdadeiras.
                            </label>

                        </div>

                    </fieldset>


                    <button type="submit" class="botao">
                        Enviar cadastro
                    </button>

                </form>

            </div>
        </section>

    </main>


    <footer>
        <div class="container">

            <p>
                &copy; 2026 Conexão Solidária -
                Todos os direitos reservados.
            </p>

        </div>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
